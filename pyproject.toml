[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scigraph"
version = "0.1.0"
description = "SciGraph: Neuro-Symbolic Scientific Discovery & Reasoning Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Justin Mafie"}]
keywords = ["scientific-discovery", "neuro-symbolic", "claim-graph", "contradiction-detection", "sarif"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.scripts]
scigraph = "scigraph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["scigraph", "ingest", "graph", "solver", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
